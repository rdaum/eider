[package]
name = "infer"
version.workspace = true
edition.workspace = true

[dependencies]
fast-telemetry.workspace = true
rand = "0.9"
serde_json.workspace = true
nvfp4.workspace = true
tokenizers = "0.22"
minijinja = { version = "2.21.0", features = ["json"] }
serde = { version = "1", features = ["derive"] }
minijinja-contrib = { version = "2.21.0", features = ["pycompat"] }

[dev-dependencies]
micromeasure.workspace = true
rayon = "1"

[[bench]]
name = "qwen36_routed_gate_up"
harness = false

[[bench]]
name = "sampling"
harness = false

[[bench]]
name = "qwen36_cpu_shared_expert"
harness = false

[[bench]]
name = "qwen36_decode_batch"
harness = false

[[bench]]
name = "qwen36_prefill"
harness = false
